[package]
name = "ai-engine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0"
sha2 = "0.10"
pdf-extract = "0.9.0"
tokio = { version = "1.47.1", features = ["full", "macros", "fs"] }
dotenv = "0.15"
reqwest = { version = "0.12.23", features = ["json", "multipart", "rustls-tls"] }
serde_json = "=1.0.145"
serde = { version = "1.0.225", features = ["derive"] }
regex = "1.11.2"
hex = "0.4"
rusqlite = { version = "0.37.0", features = ["bundled"] }
actix-web = "4"
actix-multipart = "0.6"
futures-util = "0.3"
sanitize-filename = "0.5"
uuid = { version = "1", features = ["v4", "std"] }
actix-cors = "0.7.1"
