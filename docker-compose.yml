services:
  # 1. IPFS Daemon
  ipfs:
    image: ipfs/kubo:latest
    container_name: blockscribe_ipfs
    ports:
      - "5001:5001" # API
      - "8080:8080" # Gateway (Moved to 8081 so Vite can have 8080)
      - "4001:4001" # Swarm
    volumes:
      - ipfs_data:/data/ipfs

  # 2. Solana Test Ledger
  solana:
    image: solanalabs/solana:stable
    container_name: blockscribe_solana
    command: solana-test-validator --rpc-bind-address 0.0.0.0
    ports:
      - "8899:8899" # RPC
      - "8900:8900" # WebSocket

  # 3. Frontend (React/Vite)
  frontend:
    image: node:20-alpine
    container_name: blockscribe_frontend
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules # Prevents local node_modules from overwriting container's
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8081"
    ports:
      - "8081:8081"
    depends_on:
      - rust-backend

  # 4 & 5. Python Vector Service
  python-engine:
    image: python:3.10-slim
    container_name: blockscribe_python
    working_dir: /app/backend/ai-engine/src/vectored
    volumes:
      - ./:/app
    # Install dependencies and run directly, skipping the virtual env
    command: sh -c "pip install -r requirements.txt && python vector_service.py"
    ports:
      - "8001:8001"

  # 6. Rust Backend
  rust-backend:
    image: rust:latest
    container_name: blockscribe_rust
    working_dir: /app/backend/ai-engine
    volumes:
      - ./:/app
      - cargo_cache:/usr/local/cargo/registry # Caches packages so it doesn't redownload every time
    command: cargo run
    ports:
      - "5000:5000"
    depends_on:
      - ipfs
      - solana
      - python-engine

volumes:
  ipfs_data:
  cargo_cache: