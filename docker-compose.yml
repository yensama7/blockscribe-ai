services:
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"
      - "8080:8080"
      - "4001:4001"
    volumes:
      - ipfs_data:/data/ipfs

  solana:
    image: solanalabs/solana:stable
    command: solana-test-validator --rpc-bind-address 0.0.0.0
    ports:
      - "8899:8899"
      - "8900:8900"

  frontend:
    build:
      context: .
    container_name: blockscribe_frontend
    ports:
      - "8081:8081"
    volumes:
      - ./:/app   # live editing
    depends_on:
      - rust-backend

  python-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: blockscribe_python
    ports:
      - "8001:8001"

  rust-backend:
    build:
      context: ./backend/ai-engine
      dockerfile: Dockerfile.rust
    container_name: blockscribe_rust
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - ipfs
      - solana
      - python-engine

volumes:
  ipfs_data: