services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=dev
    volumes:
      - pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"
      - "8080:8080"
      - "4001:4001"
    volumes:
      - ipfs_data:/data/ipfs

  solana:
    image: solanalabs/solana:stable
    command: solana-test-validator --rpc-bind-address 0.0.0.0
    ports:
      - "8899:8899"
      - "8900:8900"

  python-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: blockscribe_python
    ports:
      - "8001:8001"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-384}
    depends_on:
      - qdrant

  rust-backend:
    build:
      context: ./backend/ai-engine
      dockerfile: Dockerfile.rust
    container_name: blockscribe_rust
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://postgres:dev@postgres:5432/postgres
      - PYTHON_ENGINE_URL=http://python-engine:8001
      - IPFS_API_URL=http://ipfs:5001
      - IPFS_GATEWAY_URL=http://127.0.0.1:8080
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-http://solana:8899}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - INSTITUTION_NAME=${INSTITUTION_NAME:-Demo University}
      - EDITOR_EMAILS=${EDITOR_EMAILS:-}
    depends_on:
      - postgres
      - qdrant
      - ipfs
      - solana
      - python-engine

  frontend:
    build:
      context: .
    container_name: blockscribe_frontend
    ports:
      - "8081:8081"
    depends_on:
      - rust-backend

volumes:
  pg_data:
  qdrant_data:
  ipfs_data:
