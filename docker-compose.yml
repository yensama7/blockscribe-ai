services:
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"
      - "8080:8080"
      - "4001:4001"
    volumes:
      - ipfs_data:/data/ipfs

  frontend:
    build:
      context: .
    container_name: blockscribe_frontend
    ports:
      - "8081:8081"
    volumes:
      - ./:/app   # live editing
      - /app/node_modules
    depends_on:
      - rust-backend

  rust-backend:
    build:
      context: ./backend/ai-engine
      dockerfile: Dockerfile.rust
    container_name: blockscribe_rust
    ports:
      - "5000:5000"
    environment:
      - IPFS_API_URL=http://ipfs:5001
    volumes:
      - ./backend:/app/backend
    depends_on:
      - ipfs

volumes:
  ipfs_data:
