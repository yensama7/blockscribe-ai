services:
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"
      - "8080:8080"
      - "4001:4001"
    volumes:
      - ipfs_data:/data/ipfs

  solana:
    image: solanalabs/solana:stable
    command: solana-test-validator --rpc-bind-address 0.0.0.0
    ports:
      - "8899:8899"
      - "8900:8900"

  python-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: blockscribe_python
    ports:
      - "8001:8001"
    environment:
      - DB_PATH=/app/data/archive.db
    volumes:
      - archive_db:/app/data

  rust-backend:
    build:
      context: ./backend/ai-engine
      dockerfile: Dockerfile.rust
    container_name: blockscribe_rust
    ports:
      - "5000:5000"
    environment:
      - DB_PATH=/app/data/archive.db
      - PYTHON_ENGINE_URL=http://python-engine:8001
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-http://solana:8899}
      - DEVELOPER_WALLET=${DEVELOPER_WALLET:-}
    volumes:
      - archive_db:/app/data
    depends_on:
      - ipfs
      - solana
      - python-engine

  frontend:
    build:
      context: .
    container_name: blockscribe_frontend
    ports:
      - "8081:8081"
    depends_on:
      - rust-backend

volumes:
  ipfs_data:
  archive_db:
